name: Sync iCal availability

# Runs every hour and on manual trigger.
# Fetches iCal feeds from Booking.com and Airbnb, parses them,
# and writes docs/assets/availability.json to the repo.
#
# Booking.com URLs are stored in GitHub Secrets:
#   ICAL_VM_BOOKING  — Hestía Mar,      Booking iCal URL
#   ICAL_VT_BOOKING  — Hestía Thalassa, Booking iCal URL
#   ICAL_VS_BOOKING  — Hestía Salinas,  Booking iCal URL
#
# Airbnb URLs are hardcoded below (read-only calendar tokens).

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:          # manual trigger from GitHub UI

# Prevent overlapping runs from generating false-alarm cancelled emails.
concurrency:
  group: sync-ical
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install icalendar requests

      - name: Sync availability data
        env:
          ICAL_VM_AIRBNB:  ${{ secrets.ICAL_VM_AIRBNB }}
          ICAL_VM_BOOKING: ${{ secrets.ICAL_VM_BOOKING }}
          ICAL_VT_AIRBNB:  ${{ secrets.ICAL_VT_AIRBNB }}
          ICAL_VT_BOOKING: ${{ secrets.ICAL_VT_BOOKING }}
          ICAL_VS_AIRBNB:  ${{ secrets.ICAL_VS_AIRBNB }}
          ICAL_VS_BOOKING: ${{ secrets.ICAL_VS_BOOKING }}
          ICAL_DEBUG: "0"
        run: python .github/scripts/sync_ical.py

      - name: Show result
        if: always()
        run: cat docs/assets/availability.json

      # Recalcula las ofertas de hueco corto (2-5 noches) tras el cambio de
      # disponibilidad: poda las caducadas y auto-crea el descuento de última hora.
      - name: Recalcular ofertas de hueco
        run: node scripts/recalc-gap-offers.mjs

      - name: Commit and push if changed
        run: |
          git config user.name  "hestia-bot"
          git config user.email "bot@hestiayourhome.com"
          git add docs/assets/availability.json
          git add docs/data/prices.json
          git add docs/assets/ical-debug/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync availability + recalcular ofertas de hueco [skip ci]"
            # rebase por si el admin tocó el repo entre checkout y push
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push
          else
            echo "No changes — availability y ofertas al día."
          fi
