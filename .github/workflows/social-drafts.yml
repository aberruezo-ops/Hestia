name: Generar borradores de redes

# Tres borradores al mes, sacados de la edición vigente del blog (que el
# agente mensual deja lista el último día del mes y se publica al fusionar):
# la Voz del apartamento de turno, el plan del mes y un guion de reel para
# grabar. Corre el día 2 para dar margen al merge del blog.
# NO publica nada: solo escribe docs/data/social-drafts.json. La publicación
# es manual desde la pestaña Redes de /p-edit.

on:
  schedule:
    - cron: '0 8 2 * *'   # día 2 de cada mes, 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar borradores
        run: node scripts/gen-social-drafts.mjs
      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain docs/data/social-drafts.json)" ]; then
            git config user.name "hestia-bot"
            git config user.email "info@hestiayourhome.com"
            git add docs/data/social-drafts.json
            git commit -m "chore(redes): borradores del mes [skip ci]"
            git push
          else
            echo "Sin cambios."
          fi
