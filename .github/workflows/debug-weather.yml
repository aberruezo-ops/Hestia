name: DEBUG temporal — verificar widget del tiempo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar respuesta real de Open-Meteo (campos pedidos)
        run: |
          curl -sS "https://api.open-meteo.com/v1/forecast?latitude=37.1833&longitude=-1.8333&current=temperature_2m,weather_code,relative_humidity_2m,apparent_temperature,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code,apparent_temperature_max,relative_humidity_2m_mean,wind_speed_10m_max&timezone=Europe%2FMadrid&forecast_days=2" | tee /tmp/wx.json
          echo "---"
          echo "Campos presentes en 'current':"
          python3 -c "import json; d=json.load(open('/tmp/wx.json')); print(list(d.get('current',{}).keys()))"
          echo "Campos presentes en 'daily':"
          python3 -c "import json; d=json.load(open('/tmp/wx.json')); print(list(d.get('daily',{}).keys()))"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Comprobar la web EN PRODUCCIÓN de verdad (no local)
        run: |
          cat > /tmp/check.mjs << 'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          page.on('pageerror', e => console.log('pageerror:', e.message));
          await page.goto('https://www.hestiayourhome.com/index.html', { waitUntil: 'load', timeout: 30000 });
          await page.waitForTimeout(1000);
          try {
            const accept = await page.waitForSelector('button:has-text("ACEPTAR")', { timeout: 3000 });
            if (accept) await accept.click();
          } catch (_) {}
          await page.waitForTimeout(500);
          await page.evaluate(() => window.scrollTo(0, window.innerHeight * 1.2));
          await page.waitForTimeout(1000);
          const pillFound = await page.evaluate(() => {
            const pill = document.querySelector('.widget-mini-weather');
            if (pill) { pill.click(); return true; }
            return false;
          });
          console.log('Pill del widget de tiempo encontrada y pulsada:', pillFound);
          await page.waitForTimeout(4000);   // fetch real a Open-Meteo, dale tiempo
          const facts = await page.evaluate(() => [...document.querySelectorAll('.wthr-fact')].map(el => el.textContent.trim()));
          console.log('Contenido de .wthr-fact en la home real:', JSON.stringify(facts, null, 2));
          const cardText = await page.evaluate(() => document.querySelector('.widget-weather')?.textContent || '(no encontrado .widget-weather)');
          console.log('Texto completo de la tarjeta:', cardText);
          await browser.close();
          EOF
          node /tmp/check.mjs
