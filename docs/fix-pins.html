<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Editor de pins · Hestía</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="stylesheet" href="assets/leaflet.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;display:flex;height:100dvh;overflow:hidden;background:#1a0a1e;color:#faf6f0}
#map{flex:1;height:100dvh}
#panel{width:340px;flex-shrink:0;display:flex;flex-direction:column;background:#2a0f2e;border-left:1px solid rgba(250,246,240,.1)}
#panel-head{padding:14px 16px;border-bottom:1px solid rgba(250,246,240,.1)}
#panel-head h1{font-size:14px;font-weight:700;color:#faf6f0;letter-spacing:.04em}
#panel-head p{font-size:11px;color:rgba(250,246,240,.5);margin-top:3px;line-height:1.5}
#search-wrap{padding:10px 12px;border-bottom:1px solid rgba(250,246,240,.1)}
#search{width:100%;background:rgba(250,246,240,.08);border:1px solid rgba(250,246,240,.15);border-radius:6px;color:#faf6f0;padding:7px 10px;font-size:12px;outline:none}
#search::placeholder{color:rgba(250,246,240,.35)}
#search:focus{border-color:rgba(63,170,187,.6)}
#changes-head{padding:10px 12px 6px;font-size:11px;font-weight:600;color:rgba(250,246,240,.45);letter-spacing:.08em;text-transform:uppercase}
#changes{flex:1;overflow-y:auto;padding:0 12px 12px}
.change-item{background:rgba(250,246,240,.05);border:1px solid rgba(250,246,240,.1);border-radius:6px 0 6px 0;padding:9px 10px;margin-bottom:6px;font-size:11px;line-height:1.6}
.change-name{font-weight:700;color:#6fc4d1;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.change-old{color:rgba(250,246,240,.4);text-decoration:line-through}
.change-new{color:#faf6f0}
.change-undo{float:right;background:none;border:1px solid rgba(250,246,240,.2);color:rgba(250,246,240,.5);border-radius:3px;cursor:pointer;font-size:10px;padding:1px 5px;margin-left:6px}
.change-undo:hover{color:#faf6f0;border-color:rgba(250,246,240,.5)}
#empty-msg{color:rgba(250,246,240,.3);font-size:12px;padding:16px 0;text-align:center}
#footer{padding:12px;border-top:1px solid rgba(250,246,240,.1);display:flex;gap:8px}
#btn-export{flex:1;background:#3aaabb;color:#fff;border:none;border-radius:6px 0 6px 0;padding:10px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.02em}
#btn-export:hover{background:#2a8e9e}
#btn-reset{background:none;border:1px solid rgba(250,246,240,.2);color:rgba(250,246,240,.5);border-radius:6px;padding:10px 14px;font-size:12px;cursor:pointer}
#btn-reset:hover{color:#faf6f0;border-color:rgba(250,246,240,.4)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a0f2e;border:1px solid #3aaabb;color:#6fc4d1;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9999}
#toast.show{opacity:1}
/* Leaflet tooltip override */
.leaflet-tooltip{border-radius:4px 0 4px 0 !important;border:1px solid rgba(42,15,46,.2) !important;font-size:11px !important}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="panel-head">
    <h1>Editor de pins · Hestía</h1>
    <p>Arrastra cualquier pin a su posición correcta.<br>Los cambios aparecen abajo. Al exportar, pega el JSON en el chat con Claude.</p>
  </div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Buscar lugar…" autocomplete="off"/>
  </div>
  <div id="changes-head">Cambios (<span id="count">0</span>)</div>
  <div id="changes"><p id="empty-msg">Sin cambios aún</p></div>
  <div id="footer">
    <button id="btn-export">Exportar JSON</button>
    <button id="btn-reset">Reiniciar</button>
  </div>
</div>
<div id="toast"></div>

<script src="assets/leaflet.js"></script>
<script>
const CAT_COLORS = {
  home:'#2A0F2E', super:'#6B7A3A', restaurant:'#B86A3C', michelin:'#D4A84A',
  bar:'#3AAABB', fish:'#4E7A9A', abasto:'#8A6A2E', pharmacy:'#B82490',
  health:'#B8246E', vet:'#4E8A5A', 'pet-board':'#7A5E8A', physio:'#5A7A8A',
  bodega:'#8A4A2E', coworking:'#4A6A8A', laundry:'#6A8A6A', atm:'#8A7A4A',
  market:'#7A4A2E', sport:'#3A6A8A', trek:'#4A7A3A', nature:'#3A8A5A',
  beach:'#2A8A9E', geo:'#7A4A7A', culture:'#6A4A3A', celiac:'#8A6A4A',
  bookshop:'#4A4A8A', gas:'#8A3A3A', ev:'#3A8A7A',
};

let places = [];
let markers = {};
let changes = {}; // id → {newLat, newLng, marker}
let originals = {}; // id → {lat, lng}
let searchActive = null;

const map = L.map('map', {scrollWheelZoom:true}).setView([37.22, -1.81], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://openstreetmap.org/copyright">OSM</a>',maxZoom:19
}).addTo(map);

function makeIcon(cat, big) {
  const col = CAT_COLORS[cat] || '#3AAABB';
  const r = big ? 9 : 7;
  return L.divIcon({
    className:'',
    html:`<svg width="${r*2+4}" height="${r*2+4}"><circle cx="${r+2}" cy="${r+2}" r="${r}" fill="${col}" stroke="#fff" stroke-width="2"/></svg>`,
    iconSize:[r*2+4,r*2+4],
    iconAnchor:[r+2,r+2],
  });
}

function renderChanges() {
  const el = document.getElementById('changes');
  const ids = Object.keys(changes);
  document.getElementById('count').textContent = ids.length;
  if (!ids.length) { el.innerHTML='<p id="empty-msg">Sin cambios aún</p>'; return; }
  el.innerHTML = ids.map(id => {
    const p = places.find(x=>x.id===id);
    const c = changes[id];
    const o = originals[id];
    return `<div class="change-item" data-id="${id}">
      <div class="change-name">${p.name}<button class="change-undo" onclick="undoChange('${id}')">deshacer</button></div>
      <div class="change-old">${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</div>
      <div class="change-new">→ ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}</div>
    </div>`;
  }).join('');
}

function undoChange(id) {
  const o = originals[id];
  const m = markers[id];
  m.setLatLng([o.lat, o.lng]);
  delete changes[id];
  renderChanges();
}

function addMarker(p) {
  const m = L.marker([p.lat, p.lng], {
    icon: makeIcon(p.cat, p.cat==='home'),
    draggable: true,
    title: p.name,
  });
  m.bindTooltip(p.name, {direction:'top', offset:[0,-8]});
  m.on('dragend', () => {
    const ll = m.getLatLng();
    const o = originals[p.id];
    const dist = map.distance([o.lat,o.lng],[ll.lat,ll.lng]);
    if (dist < 20) { // snap back if tiny move
      m.setLatLng([o.lat, o.lng]);
      delete changes[p.id];
    } else {
      changes[p.id] = {lat: ll.lat, lng: ll.lng};
    }
    renderChanges();
  });
  m.addTo(map);
  markers[p.id] = m;
}

function loadPlaces(data) {
  places = data;
  places.forEach(p => {
    originals[p.id] = {lat: p.lat, lng: p.lng};
    addMarker(p);
  });
}

// Search
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) {
    if (searchActive) { markers[searchActive].closeTooltip(); searchActive=null; }
    return;
  }
  const found = places.find(p => p.name.toLowerCase().includes(q) || p.id.includes(q));
  if (found) {
    const m = markers[found.id];
    map.setView(m.getLatLng(), 16);
    m.openTooltip();
    searchActive = found.id;
  }
});

// Export
document.getElementById('btn-export').addEventListener('click', () => {
  if (!Object.keys(changes).length) { showToast('Sin cambios que exportar'); return; }
  const out = Object.entries(changes).map(([id,c]) => ({id, lat:parseFloat(c.lat.toFixed(5)), lng:parseFloat(c.lng.toFixed(5))}));
  const json = JSON.stringify(out, null, 2);
  navigator.clipboard.writeText(json).then(
    () => showToast(`JSON copiado al portapapeles (${out.length} cambios)`),
    () => {
      const ta = document.createElement('textarea');
      ta.value = json;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast(`JSON copiado (${out.length} cambios)`);
    }
  );
});

// Reset
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!Object.keys(changes).length) return;
  if (!confirm('¿Reiniciar todos los cambios?')) return;
  Object.keys(changes).forEach(id => {
    markers[id].setLatLng([originals[id].lat, originals[id].lng]);
  });
  changes = {};
  renderChanges();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 3000);
}

// Load data
fetch('data/places.json')
  .then(r=>r.json())
  .then(loadPlaces)
  .catch(()=>{
    document.getElementById('empty-msg').textContent='Error cargando places.json: sirve desde docs/ con un servidor local';
  });
</script>
</body>
</html>
