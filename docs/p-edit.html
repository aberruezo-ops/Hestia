<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous" onerror="this.onerror=null;this.src='assets/react.development.js'"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous" onerror="this.onerror=null;this.src='assets/react-dom.development.js'"></script>
<script src="assets/leaflet.js"></script>
<script>
  const COMPONENT_FILES = [
    'components/shared.f62216ed14.js',
    'components/admin-page.f62216ed14.js',
  ];

  async function loadComponents() {
    for (const file of COMPONENT_FILES) {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = file + '?t=' + Date.now();
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load ${file}`));
        document.head.appendChild(script);
      });
    }
  }

  loadComponents().catch(err => {
    const _errRoot = document.getElementById('root');
    const _errDiv = document.createElement('div');
    _errDiv.style.cssText = 'padding:40px;font-family:sans-serif;color:#c00';
    _errDiv.innerHTML = '<b>Error loading components:</b><br>';
    _errDiv.appendChild(document.createTextNode(err.message));
    _errRoot.replaceChildren(_errDiv);
    console.error(err);
  });
</script>

</body>
