<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2A0F2E"/>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <meta name="referrer" content="no-referrer"/>
  <!-- GitHub Pages no deja fijar cabeceras HTTP reales; estas etiquetas son
       lo único disponible para pedirle al navegador que no cachee este
       shell de forma agresiva (el problema de fondo que causó la pantalla
       de "Error loading components" con un hash de archivo ya borrado). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Hestía Admin"/>
  <link rel="manifest" href="p-edit.webmanifest"/>
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
  <title>Hestía · Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://unpkg.com" crossorigin/>
  <link rel="dns-prefetch" href="//unpkg.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/styles.css?v=1160"/>
  <link rel="stylesheet" href="assets/leaflet.css"/>
</head><body class="pe-body">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="assets/leaflet.js"></script>
<script>
  const COMPONENT_FILES = [
    'components/shared.f896aafa7e.js',
    'components/admin-page.f896aafa7e.js',
  ];

  // Si el CDN de React falla, carga las copias locales EN ORDEN (react antes
  // que react-dom) y solo entonces evalúa los componentes. Sin esto, la página
  // quedaba en blanco con "React is not defined" cuando unpkg no responde.
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('No cargó ' + src));
      document.head.appendChild(s);
    });
  }
  async function waitForReact() {
    if (!window.React) await loadScript('assets/react.development.js');
    if (!window.ReactDOM) await loadScript('assets/react-dom.development.js');
  }

  async function loadComponents() {
    await waitForReact();
    for (const file of COMPONENT_FILES) {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = file + '?t=' + Date.now();
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load ${file}`));
        document.head.appendChild(script);
      });
    }
  }

  // Si falla la carga de un componente, casi siempre es porque ESTA MISMA
  // página (p-edit.html) se sirvió desde una caché vieja del dispositivo,
  // con nombres de archivo con hash que ya no existen (se renombran en
  // cada build). Muy frecuente en el acceso "Añadir a pantalla de inicio"
  // de iOS, que cachea el shell de forma más agresiva que Safari normal y
  // no tiene botón de recargar. En vez de dejar una pantalla roja muerta,
  // se intenta UNA vez recargar el propio documento con un parámetro que
  // rompe la caché; si sigue fallando tras ese reintento, ahí sí se
  // muestra el error (evita el bucle infinito si el fallo es de verdad).
  loadComponents().catch(err => {
    console.error(err);
    const RELOAD_KEY = 'hestia-admin-reload-once';
    if (!sessionStorage.getItem(RELOAD_KEY)) {
      sessionStorage.setItem(RELOAD_KEY, '1');
      location.replace(location.pathname + '?_r=' + Date.now());
      return;
    }
    sessionStorage.removeItem(RELOAD_KEY);
    const _errRoot = document.getElementById('root');
    const _errDiv = document.createElement('div');
    _errDiv.style.cssText = 'padding:40px;font-family:sans-serif;color:#c00';
    _errDiv.innerHTML = '<b>Error loading components:</b><br>';
    _errDiv.appendChild(document.createTextNode(err.message));
    const _retryBtn = document.createElement('button');
    _retryBtn.textContent = 'Reintentar';
    _retryBtn.style.cssText = 'margin-top:16px;padding:8px 18px;font-size:14px;cursor:pointer';
    _retryBtn.onclick = () => location.replace(location.pathname + '?_r=' + Date.now());
    _errDiv.appendChild(document.createElement('br'));
    _errDiv.appendChild(_retryBtn);
    _errRoot.replaceChildren(_errDiv);
  });
</script>

</body>
</html>
