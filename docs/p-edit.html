<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2A0F2E"/>
  <meta name="robots" content="noindex,nofollow,noarchive"/>

  <title>Hestía · Pricing Edit</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="dns-prefetch" href="//unpkg.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,opsz,wght@0,5..1200,400..900;1,5..1200,400..900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/styles.css?v=318"/>
</head>
<body class="pe-body">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous" onerror="this.onerror=null;this.src='assets/react.development.js'"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous" onerror="this.onerror=null;this.src='assets/react-dom.development.js'"></script>
<script>
  const COMPONENT_FILES = [
    'components/admin-page.js',
  ];

  async function loadComponents() {
    for (const file of COMPONENT_FILES) {
      const res = await fetch(file + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(`Failed to load ${file}: ${res.status}`);
      const code = await res.text();
      // eslint-disable-next-line no-eval
      eval(code);
    }
  }

  loadComponents().catch(err => {
    document.getElementById('root').innerHTML =
      `<div style="padding:40px;font-family:sans-serif;color:#c00">
        <b>Error loading components:</b><br>${err.message}
      </div>`;
    console.error(err);
  });
</script>

</body>
</html>
