<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Guía de marca de Hestía</title>
<meta name="robots" content="noindex, nofollow"/>
<meta name="referrer" content="no-referrer"/>
<meta name="theme-color" content="#2A0F2E"/>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png"/>
  <script src="assets/favicon-dia-noche.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Hanken+Grotesk:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ber-dk:#2A0F2E;--sol:#3AAABB;--sol-h:#2A8E9E;--sol-lt:#6FC4D1;--crema:#FAF6F0;--arena:#F0E8D5;--bug:#D42B80;
  --serif:'Fraunces','Lora',Georgia,serif;--sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--dur-fast:160ms;--dur-base:220ms}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.6;background:var(--ber-dk);color:var(--crema);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.gate{position:relative;min-height:100svh;display:grid;place-items:center;padding:32px 24px;isolation:isolate;overflow:hidden}
.gate-bg{position:absolute;inset:0;z-index:-2}
.gate-bg img{width:100%;height:100%;object-fit:cover;object-position:62% 24%;opacity:.9}
.gate::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(26,10,30,.86),rgba(42,15,46,.78) 50%,rgba(26,10,30,.94))}
.indalo{position:absolute;left:50%;top:50%;width:min(92vw,720px);transform:translate(-50%,-50%);color:var(--crema);opacity:.07;z-index:-1;pointer-events:none}
.box{width:100%;max-width:440px;display:grid;gap:22px;justify-items:center;text-align:center}
.lockup{display:inline-flex;align-items:center;gap:14px}
.lockup img{width:48px;height:48px}
.wm{display:block;font-family:var(--serif);font-weight:300;text-transform:uppercase;letter-spacing:.44em;line-height:1;font-size:16px;text-align:left}
.wm-sub{display:block;font-family:var(--sans);font-weight:200;text-transform:lowercase;letter-spacing:.28em;font-size:10px;margin-top:5px;opacity:.78;text-align:left}
.eyebrow{font-weight:500;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--sol-lt);margin:18px 0 0}
h1{font-family:var(--serif);font-weight:400;font-variation-settings:'opsz' 48;font-size:clamp(38px,8vw,56px);line-height:1.04;letter-spacing:-.01em;margin:0}
h1 .it{font-style:italic;color:var(--sol-lt)}
p.lead{margin:0;color:rgba(240,232,213,.86);font-size:16.5px;max-width:34ch}
form{width:100%;display:grid;gap:12px;margin-top:6px}
label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.field{display:flex;border:1px solid rgba(240,232,213,.55);border-radius:10px 0 10px 0;background:rgba(240,232,213,.07);transition:border-color var(--dur-base) var(--ease-out),background var(--dur-base) var(--ease-out)}
.field:focus-within{border-color:var(--sol-lt);background:rgba(240,232,213,.12)}
.field.bad{border-color:var(--bug);animation:nope .38s var(--ease-out)}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--crema);font:500 18px var(--sans);letter-spacing:.2em;text-align:center;padding:15px 12px;text-transform:uppercase}
input::placeholder{color:rgba(240,232,213,.55);letter-spacing:.2em}
.eye{appearance:none;background:none;border:0;color:var(--crema);padding:0 16px;cursor:pointer;font:500 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.eye:hover{opacity:1}
.btn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 28px;border-radius:10px 0 10px 0;border:1px solid var(--sol);background:var(--sol);color:var(--ber-dk);font:500 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;transition:background var(--dur-base) var(--ease-out),color var(--dur-base) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.btn:hover{background:var(--sol-h);border-color:var(--sol-h);color:var(--crema)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;cursor:progress}
.msg{min-height:24px;margin:0;font-size:14.5px;color:#FFB3D6}
.help{margin:0;font-size:13.5px;color:rgba(240,232,213,.74)}
:focus-visible{outline:2px solid var(--sol-lt);outline-offset:3px}
@keyframes nope{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="gate">
  <div class="gate-bg"><img src="assets/hero-poster-atardecer-morado-hestia.jpg" alt="" width="1280" height="1864" decoding="async"/></div>
  <svg class="indalo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=".3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 13C4.5 5.5 19.5 5.5 19.5 13"/><path d="M12 6.8V15"/><path d="M12 11 4.5 13M12 11 19.5 13"/><path d="M12 15l-3.2 5M12 15l3.2 5"/></svg>
  <div class="box">
    <div class="lockup"><img src="assets/logo-teal-transparent.png" alt="" width="48" height="48"/><span><span class="wm">Hestía</span><span class="wm-sub">your home!</span></span></div>
    <p class="eyebrow">Guía de marca</p>
    <h1>Esta guía es <span class="it">privada.</span></h1>
    <p class="lead">Introduce el PIN del equipo para entrar.</p>
    <form id="f" autocomplete="off" novalidate>
      <label for="pin">PIN del equipo</label>
      <div class="field" id="fld">
        <input id="pin" name="pin" type="password" placeholder="PIN" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="24" required aria-describedby="msg"/>
        <button class="eye" id="eye" type="button" aria-pressed="false">Ver</button>
      </div>
      <button class="btn" id="go" type="submit"><span id="gol">Entrar</span> <span aria-hidden="true">→</span></button>
      <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
    </form>
    <p class="help">¿No lo tienes? Pídeselo a Alex o a Fran.</p>
  </div>
</main>
<noscript><p style="position:fixed;left:0;right:0;bottom:24px;text-align:center;color:#F0E8D5;font:14px sans-serif">Esta página necesita JavaScript para comprobar el PIN.</p></noscript>

  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});};
  var $=function(id){return document.getElementById(id);};
  var pin=$('pin'),msg=$('msg'),go=$('go'),gol=$('gol'),fld=$('fld'),fails=0;

  function show(html){
    function w(){document.open();document.write(html);document.close();}
    if(document.readyState==='complete')w();else addEventListener('load',w);
  }
  function unseal(raw){
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},k,b64(D.ct));
    }).then(function(buf){return new TextDecoder().decode(buf);});
  }
  function keyFromPin(p){
    var norm=p.toUpperCase().replace(/[^A-Z0-9]/g,'');
    return crypto.subtle.importKey('raw',new TextEncoder().encode(norm),'PBKDF2',false,['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(D.salt),iterations:D.iter},km,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(wk){
      var i=0;
      function next(){
        if(i>=D.wraps.length)return null;
        var w=D.wraps[i++];
        return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.iv)},wk,b64(w.ct)).catch(function(){return null;}).then(function(r){return r||next();});
      }
      return next();
    });
  }
  function save(raw){try{sessionStorage.setItem('gm',btoa(String.fromCharCode.apply(null,new Uint8Array(raw))));}catch(e){}}

  try{
    var s=sessionStorage.getItem('gm');
    if(s&&window.crypto&&crypto.subtle)unseal(b64(s)).then(show).catch(function(){try{sessionStorage.removeItem('gm');}catch(e){}});
  }catch(e){}

  $('eye').addEventListener('click',function(){
    var on=pin.type==='password';pin.type=on?'text':'password';
    this.textContent=on?'Ocultar':'Ver';this.setAttribute('aria-pressed',on?'true':'false');pin.focus();
  });
  pin.addEventListener('input',function(){msg.textContent='';fld.classList.remove('bad');});

  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    var v=pin.value.trim();
    if(!v){msg.textContent='Escribe el PIN.';pin.focus();return;}
    if(!(window.crypto&&crypto.subtle)){msg.textContent='Este navegador no puede comprobar el PIN. Ábrelo con una versión reciente.';return;}
    go.disabled=true;gol.textContent='Comprobando';msg.textContent='';
    keyFromPin(v).then(function(raw){
      if(!raw)return null;
      return unseal(raw).then(function(html){save(raw);return html;});
    }).then(function(html){
      if(html){show(html);return;}
      fails++;fld.classList.remove('bad');void fld.offsetWidth;fld.classList.add('bad');
      msg.textContent='Ese PIN no es correcto. Prueba de nuevo.';pin.select();gol.textContent='Entrar';
      setTimeout(function(){go.disabled=false;},Math.min(fails,5)*700);
    }).catch(function(){
      msg.textContent='No se ha podido abrir la guía. Recarga la página.';go.disabled=false;gol.textContent='Entrar';
    });
  });
  pin.focus();
})();
