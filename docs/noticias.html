<script>
  const __PRM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  window.__TWEAKS__ = { starfield: false && !__PRM, parallax: false && !__PRM };

  const COMPONENT_FILES = [
    'components/shared.js',
    'components/chrome.js',
    'components/noticias-page.js',
  ];

  async function loadComponents() {
    // prices.json antes de evaluar componentes (shared.jsx lo lee al parsear)
    try {
      const pr = await fetch('data/prices.json?t=' + Date.now(), { cache: 'no-store' });
      if (pr.ok) window.PRICES_V2 = await pr.json();
    } catch (e) { console.warn('prices.json fetch failed; using fallback', e); }

    for (const file of COMPONENT_FILES) {
      const res = await fetch(file + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(`Failed to load ${file}: ${res.status}`);
      const code = await res.text();
      // eslint-disable-next-line no-eval
      eval(code);
    }
  }

  loadComponents().catch(err => {
    document.getElementById('root').innerHTML =
      `<div style="padding:40px;font-family:sans-serif;color:#c00">
        <b>Error loading components:</b><br>${err.message}
      </div>`;
    console.error(err);
  });
</script>
