  <h1>Normas de Hestía · Hestía Your Home</h1>
  <p>Las normas de uso de los tres apartamentos de Hestía en Vera Playa, publicadas antes de reservar para que no haya sorpresas. Salen del contrato que se firma y existen para que la disfrutéis vosotros, los siguientes huéspedes y los vecinos.</p>
  <p>Entrada a partir de las 15:00 y salida antes de las 11:00. Necesitamos ese margen para dejar el apartamento a punto para la siguiente llegada. Entrada anticipada y salida tardía, sujetas a disponibilidad.</p>
  <p>Hestía es solo para quienes figuran en la reserva, nunca para terceros. Todos los huéspedes que pernoctan van en el contrato y en el parte de viajeros, como exige la normativa española.</p>
  <p>No se fuma dentro del apartamento, en ninguna estancia. Las toallas se quedan dentro de Hestía: para la piscina y la playa, cada uno lleva las suyas. La ropa se tiende solo en el tendedero, nunca en barandillas ni en la terraza.</p>
  <p>Se respeta el descanso propio y el de los vecinos, evitando ruidos, música o jaleo a deshoras. Si salís, recoged la terraza (cojines, toldo y plantas), sobre todo si hay viento o previsión de mal tiempo.</p>
  <p>En las zonas comunes rigen las normas de cada urbanización, en especial el horario de piscina. No está permitido el naturismo ni el top less en ninguna zona de la urbanización. Dentro de la mancomunidad se circula despacio: hay niños, mascotas y peatones.</p>
  <p>En la piscina y zonas comunes está terminantemente prohibido hacer necesidades. Los bebés deben bañarse siempre con pañal de baño. Los menores quedan bajo responsabilidad de sus padres o tutores.</p>
  <p>Mascotas bienvenidas en los tres apartamentos, siempre con petición previa y con un suplemento moderado por noche, con tope por estancia.</p>
  <p>Cuidad el equipamiento y el mobiliario: tras la estancia hacemos inventario. Y cuidad el entorno, sin malgastar luz ni agua y sin dejar el aire acondicionado encendido con las ventanas abiertas o cuando salgáis.</p>
  <p>Cualquier cosa puede romperse o fallar. Lo que garantizamos es que estaremos pendientes y haremos todo lo que esté en nuestra mano para resolverlo cuanto antes.</p>
