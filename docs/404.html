<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2A0F2E"/>
  <title>Página no encontrada · Hestía Your Home</title>
  <meta name="robots" content="noindex, follow"/>
  <script>
    /* Red de seguridad: URLs de la web antigua (/home/... y /rental/...) → página actual. */
    (function () {
      var p = location.pathname.toLowerCase();
      if (p.indexOf('/home/') !== 0 && p.indexOf('/rental/') !== 0) return;
      var t = '/';
      if      (p.indexOf('thalassa') > -1) t = '/thalassa.html';
      else if (p.indexOf('salinas')  > -1) t = '/salinas.html';
      else if (p.indexOf('mar')      > -1) t = '/mar.html';
      else if (p.indexOf('blog')     > -1 || p.indexOf('news') > -1 || p.indexOf('notici') > -1) t = '/noticias.html';
      else if (p.indexOf('larga')    > -1 || p.indexOf('estancia') > -1 || p.indexOf('long') > -1) t = '/estancias-largas.html';
      else if (p.indexOf('opinion')  > -1 || p.indexOf('review') > -1) t = '/opiniones.html';
      else if (p.indexOf('nosotros') > -1 || p.indexOf('about') > -1) t = '/nosotros.html';
      else if (p.indexOf('contact')  > -1) t = '/contacto.html';
      else if (p.indexOf('reserva')  > -1 || p.indexOf('book') > -1 || p.indexOf('rental') > -1) t = '/reservas.html';
      location.replace(t);
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css?v=665"/>
  <style>
    .e404-wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--ber-dk, #2A0F2E);
      padding: 40px var(--page-pad, 24px) 80px;
      text-align: center;
    }
    .e404-logo {
      width: 52px;
      height: 52px;
      margin-bottom: 32px;
      filter: brightness(0) invert(1) sepia(60%) saturate(450%) hue-rotate(355deg) brightness(98%);
    }
    .e404-code {
      font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(72px, 15vw, 120px);
      font-weight: 400;
      line-height: 1;
      color: var(--crema, #FAF6F0);
      opacity: 0.18;
      margin: 0 0 -24px;
      letter-spacing: -0.02em;
    }
    .e404-title {
      font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 400;
      color: var(--crema, #FAF6F0);
      margin: 0 0 12px;
    }
    .e404-sub {
      font-size: 15px;
      color: rgba(240, 232, 213, 0.65);
      margin: 0 0 40px;
      max-width: 340px;
      line-height: 1.6;
    }
    .e404-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .e404-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px 0 10px 0;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.18s;
    }
    .e404-link--primary {
      background: var(--sol, #3AAABB);
      color: #fff;
    }
    .e404-link--secondary {
      background: rgba(240, 232, 213, 0.10);
      color: var(--crema, #FAF6F0);
      border: 1px solid rgba(240, 232, 213, 0.20);
    }
    .e404-link:hover { opacity: 0.82; }
  </style>
</head>
<body>
  <div class="e404-wrap">
    <img src="assets/logo-teal-transparent.png" alt="Hestía" class="e404-logo" width="52" height="52"/>
    <div class="e404-code">404</div>
    <h1 class="e404-title">Página no encontrada</h1>
    <p class="e404-sub">La página que buscas no existe o ha cambiado de dirección. Puedes volver al inicio o ir directamente a reservar.</p>
    <div class="e404-links">
      <a href="/" class="e404-link e404-link--primary">Ir al inicio</a>
      <a href="/reservas.html" class="e404-link e404-link--secondary">Reservar</a>
      <a href="/mar.html" class="e404-link e404-link--secondary">Hestía Mar</a>
      <a href="/thalassa.html" class="e404-link e404-link--secondary">Hestía Thalassa</a>
      <a href="/salinas.html" class="e404-link e404-link--secondary">Hestía Salinas</a>
    </div>
  </div>
</body>
</html>
