<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1b1238; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #1b1238; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      /* La foto se escala a 1920 de ancho y se recorta a 16:9 desde y=275 (cielo, mar y cristal del balcón) */
      #st { position: absolute; left: 0; top: -264px; width: 2000px; height: 1500px; transform: scale(0.96); transform-origin: 0 0; }
      #st > * { position: absolute; left: 0; top: 0; width: 2000px; height: 1500px; }
      #st .fill { position: absolute; left: 0; top: 0; width: 2000px; height: 1500px; }
      #base { display: block; }

      /* Cristal, cielo y mar: dos paneles cada uno, separados por el montante */
      .glass { clip-path: path("M592 487 L878 484 L878 1400 L560 1400 L548 1000 L585 700 Z M918 478 L1205 474 L1258 700 L1285 1000 L1290 1400 L945 1400 Z"); }
      .sky { clip-path: path("M592 487 L878 484 L878 704 L592 708 Z M918 478 L1205 474 L1258 686 L918 703 Z"); }
      .sea { clip-path: path("M718 706 L878 704 L878 736 L760 738 Z M918 703 L1258 686 L1262 716 L918 735 Z"); }

      /* Luz de la habitación: sombra suave y tinte de la hora, sin apagarla del todo */
      #night { background: #1a1440; mix-blend-mode: multiply; opacity: 0.5; }
      #nightOut { background: #0b0d2e; mix-blend-mode: multiply; opacity: 0.75; }
      #roomWarm { background: radial-gradient(ellipse 56% 50% at 48% 52%, rgba(255,120,70,0.95), rgba(220,60,110,0.5) 48%, rgba(120,40,140,0) 80%); mix-blend-mode: soft-light; opacity: 0; }
      #roomDawn { background: radial-gradient(ellipse 52% 46% at 47% 54%, rgba(255,186,120,0.95), rgba(255,176,104,0) 72%); mix-blend-mode: soft-light; opacity: 0; }
      #outRed { background: #ff5a3a; mix-blend-mode: overlay; opacity: 0; }
      #outViolet { background: #6a3cb0; mix-blend-mode: overlay; opacity: 0; }

      #st .skyL { opacity: 0; top: 470px; height: 240px; }
      #st .seaL { top: 684px; height: 58px; }
      #skyNight { background: linear-gradient(to bottom, #0a1030 0%, #1b2a62 55%, #4a4a86 82%, #9a6a88 100%); opacity: 1; }
      #skyDawn  { background: linear-gradient(to bottom, #3f6fb2 0%, #8fb4d8 40%, #f4b690 76%, #ffd6a0 100%); }
      #skyDusk  { background: linear-gradient(to bottom, #3b2a78 0%, #7a3f8e 30%, #c4486e 58%, #f0603a 82%, #ffb050 100%); }
      #skyTwi   { background: linear-gradient(to bottom, #150f3e 0%, #35206a 30%, #77307c 56%, #c04466 80%, #f0745a 100%); }
      /* Estelas de nube: alargadas, suaves, se desplazan despacio */

      .cl { position: absolute; width: 340px; height: 80px; }
      .cl i { position: absolute; display: block; border-radius: 50%; }
      #cloudsDay { position: absolute; left: 0; top: 0; width: 2000px; height: 1500px; opacity: 0; }
      #cloudsDay i { background: radial-gradient(ellipse at 50% 55%, rgba(255,255,255,0.95), rgba(255,255,255,0) 72%); }
      #cloudsDusk { position: absolute; left: 0; top: 0; width: 2000px; height: 1500px; opacity: 0; }
      #cloudsDusk i { background: radial-gradient(ellipse at 50% 55%, rgba(255,150,104,0.95), rgba(230,90,130,0) 72%); }
      #cloudsTwi { position: absolute; left: 0; top: 0; width: 2000px; height: 1500px; opacity: 0; }
      #cloudsTwi i { background: radial-gradient(ellipse at 50% 55%, rgba(176,110,214,0.9), rgba(130,70,170,0) 72%); }
      #seaNight { background: linear-gradient(to bottom, #1b2a5e, #0f1a44); opacity: 0.95; }
      #seaDawn  { background: radial-gradient(ellipse 320px 34px at 1085px 712px, rgba(255,214,160,0.98), rgba(255,190,130,0) 100%), linear-gradient(to bottom, #7d8fae, #556894); opacity: 0; }
      #seaDay   { background: linear-gradient(to bottom, #4f86b6, #2f628f); opacity: 0; }
      #seaDusk  { background: linear-gradient(to bottom, #f2704a, #b0406c 45%, #4a2470); opacity: 0; }
      #seaTwi   { background: linear-gradient(to bottom, #d65a62, #7a3480 45%, #281656); opacity: 0; }
      /* Reflejo del sol y brillo del horizonte sobre el mar */
      #seaLines { position: absolute; left: 0; top: 684px; width: 2000px; height: 58px; opacity: 0; mix-blend-mode: screen;
        background: repeating-linear-gradient(to bottom, rgba(255,176,140,0.8) 0 1px, rgba(255,176,140,0) 1px 5px);
        -webkit-mask-image: linear-gradient(to right, transparent 700px, #000 900px, #000 1200px, transparent 1300px); mask-image: linear-gradient(to right, transparent 700px, #000 900px, #000 1200px, transparent 1300px); }
      #glitter { mix-blend-mode: screen; opacity: 0; }
      #glitterCol { position: absolute; left: 1020px; top: 690px; width: 150px; height: 52px;
        background: repeating-linear-gradient(to bottom, rgba(255,226,170,0.95) 0 3px, rgba(255,226,170,0) 3px 7px);
        -webkit-mask-image: radial-gradient(ellipse 50% 60% at 50% 50%, #000 0%, transparent 100%); mask-image: radial-gradient(ellipse 50% 60% at 50% 50%, #000 0%, transparent 100%); }
      #horizonGlow { position: absolute; left: 700px; top: 690px; width: 600px; height: 40px; mix-blend-mode: screen; opacity: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(255,150,100,0.95), rgba(255,100,120,0) 70%); }
      #sunbox { mix-blend-mode: screen; }
      #sun { position: absolute; left: 780px; top: 440px; width: 600px; height: 600px; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #fffdf3 0 10%, #ffe6b4 11%, rgba(255,184,102,0.92) 14%, rgba(255,150,86,0.5) 26%, rgba(255,128,80,0.16) 44%, rgba(255,128,80,0) 62%); }
    </style>
  </head>

              <div class="cl cl0" style="left:500px;top:556px;transform:scale(1.0);transform-origin:0 50%"><i style="left:0px;top:28px;width:170px;height:48px"></i><i style="left:60px;top:6px;width:150px;height:56px"></i><i style="left:140px;top:18px;width:170px;height:52px"></i><i style="left:220px;top:30px;width:120px;height:40px"></i><i style="left:100px;top:36px;width:180px;height:38px"></i></div>
              <div class="cl cl1" style="left:760px;top:520px;transform:scale(0.8);transform-origin:0 50%"><i style="left:0px;top:28px;width:170px;height:48px"></i><i style="left:60px;top:6px;width:150px;height:56px"></i><i style="left:140px;top:18px;width:170px;height:52px"></i><i style="left:220px;top:30px;width:120px;height:40px"></i><i style="left:100px;top:36px;width:180px;height:38px"></i></div>
              <div class="cl cl2" style="left:1000px;top:584px;transform:scale(1.2);transform-origin:0 50%"><i style="left:0px;top:28px;width:170px;height:48px"></i><i style="left:60px;top:6px;width:150px;height:56px"></i><i style="left:140px;top:18px;width:170px;height:52px"></i><i style="left:220px;top:30px;width:120px;height:40px"></i><i style="left:100px;top:36px;width:180px;height:38px"></i></div>
              <div class="cl cl3" style="left:1170px;top:534px;transform:scale(0.7);transform-origin:0 50%"><i style="left:0px;top:28px;width:170px;height:48px"></i><i style="left:60px;top:6px;width:150px;height:56px"></i><i style="left:140px;top:18px;width:170px;height:52px"></i><i style="left:220px;top:30px;width:120px;height:40px"></i><i style="left:100px;top:36px;width:180px;height:38px"></i></div>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const E = "sine.inOut";

      gsap.set("#sun", { x: 0, y: 36 });

      // Zoom lento hacia el horizonte: el mar pasa de una raya a una franja con presencia
      tl.fromTo("#cam", { scale: 1, transformOrigin: "960px 400px" }, { scale: 1.5, duration: 10, ease: "sine.inOut" }, 0);

      // 0 a 3.4 s, ALBA: el cielo se enciende y el sol sale del mar con su reflejo
      tl.to("#skyDawn", { opacity: 1, duration: 2.2, ease: E }, 0.3);
      tl.to("#skyNight", { opacity: 0, duration: 2.2, ease: E }, 0.3);
      tl.to("#seaNight", { opacity: 0, duration: 2, ease: E }, 0.4);
      tl.to("#seaDawn", { opacity: 0.95, duration: 2, ease: E }, 0.4);
      tl.to("#sun", { y: -150, duration: 3, ease: "power1.out" }, 0.4);
      tl.to("#sun", { x: 80, duration: 5, ease: "none" }, 0.4);
      tl.to("#glitter", { opacity: 0.95, duration: 1, ease: E }, 0.9);
      tl.to("#glitterCol", { x: 30, duration: 2.6, ease: "none" }, 0.9);
      tl.to("#glitter", { opacity: 0, duration: 1.2, ease: E }, 3);
      tl.to("#night", { opacity: 0, duration: 2.4, ease: E }, 0.3);
      tl.to("#nightOut", { opacity: 0, duration: 2.4, ease: E }, 0.6);
      tl.to("#roomDawn", { opacity: 0.8, duration: 1.4, ease: E }, 0.8);
      tl.to("#roomDawn", { opacity: 0, duration: 1.6, ease: E }, 3);

      // 3.4 a 5 s, DÍA: el sol sube y sale del cristal; vuelven el cielo y el mar azules
      tl.to("#sun", { y: -460, duration: 2.2, ease: "power1.inOut" }, 2.8);
      tl.to("#skyDawn", { opacity: 0, duration: 1.4, ease: E }, 3);
      tl.to("#seaDawn", { opacity: 0, duration: 1.2, ease: E }, 3);
      tl.to("#seaDay", { opacity: 0.55, duration: 1.2, ease: E }, 3);

      // 5 a 8 s, ATARDECER: sol fuera de plano; cielo y mar rojizos, nubes rosas y violetas, luz roja en la sala
      tl.to("#seaDay", { opacity: 0, duration: 1.8, ease: E }, 5);
      tl.to("#skyDusk", { opacity: 1, duration: 2.4, ease: E }, 4.8);
      tl.to("#seaDusk", { opacity: 0.9, duration: 2.2, ease: E }, 5);
      tl.to("#horizonGlow", { opacity: 0.95, duration: 2, ease: E }, 5.2);
      tl.to("#seaLines", { opacity: 0.75, duration: 2, ease: E }, 5.4);
      tl.to("#seaLines", { x: 14, duration: 4.6, ease: "none" }, 5.4);
      tl.to("#outRed", { opacity: 0.35, duration: 2.2, ease: E }, 4.9);
      tl.to("#roomWarm", { opacity: 0.85, duration: 2.2, ease: E }, 5);

      // 8 a 10 s, CREPÚSCULO: de los rojizos a los morados
      tl.to("#skyTwi", { opacity: 1, duration: 2, ease: E }, 8);
      tl.to("#skyDusk", { opacity: 0, duration: 2, ease: E }, 8.1);
      tl.to("#seaTwi", { opacity: 0.95, duration: 2, ease: E }, 8);
      tl.to("#seaDusk", { opacity: 0, duration: 2, ease: E }, 8.1);
      tl.to("#outRed", { opacity: 0, duration: 1.8, ease: E }, 8);
      tl.to("#outViolet", { opacity: 0.42, duration: 1.8, ease: E }, 8);
      tl.to("#roomWarm", { opacity: 0.55, duration: 1.8, ease: E }, 8.2);
      tl.to("#night", { opacity: 0.32, duration: 1.8, ease: E }, 8.2);
      tl.to("#nightOut", { opacity: 0.35, duration: 1.8, ease: E }, 8.2);


      // NUBES: entran por la izquierda y cruzan despacio, cada una a su ritmo; cambian de color con la hora
      const drift = [110, 80, 140, 60, 95, 70];
      ["Day", "Dusk", "Twi"].forEach((L) => drift.forEach((d, k) => tl.fromTo("#clouds" + L + " .cl" + k, { x: -40 }, { x: d, duration: 10, ease: "none" }, 0)));
      tl.to("#cloudsDay", { opacity: 0.55, duration: 1.6, ease: E }, 0.4);
      tl.to("#cloudsDay", { opacity: 0.95, duration: 1.4, ease: E }, 3);
      tl.to("#cloudsDay", { opacity: 0, duration: 2, ease: E }, 5);
      tl.to("#cloudsDusk", { opacity: 0.95, duration: 2.2, ease: E }, 5);
      tl.to("#cloudsDusk", { opacity: 0.25, duration: 2, ease: E }, 8);
      tl.to("#cloudsTwi", { opacity: 0.85, duration: 2, ease: E }, 8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
