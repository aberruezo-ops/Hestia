    <style>
      @font-face { font-family: "Fraunces"; font-weight: 500; src: url("assets/fonts/Fraunces-500.ttf") format("truetype"); }
      @font-face { font-family: "Fraunces"; font-weight: 600; src: url("assets/fonts/Fraunces-600.ttf") format("truetype"); }
      @font-face { font-family: "Hanken Grotesk"; font-weight: 400; src: url("assets/fonts/HankenGrotesk-400.ttf") format("truetype"); }
      @font-face { font-family: "Hanken Grotesk"; font-weight: 600; src: url("assets/fonts/HankenGrotesk-600.ttf") format("truetype"); }
      @font-face { font-family: "Hanken Grotesk"; font-weight: 700; src: url("assets/fonts/HankenGrotesk-700.ttf") format("truetype"); }

      :root {
        --ber: #2A0F2E; --ber-dk: #1A0820; --ber-lt: #3D1540;
        --ink: #3D1A35; --ink-soft: #7A5A72;
        --crema: #FFFCF6; --arena: #F0E8D5;
        --cobre: #C87A45; --cobre-dk: #A85E2E;
        --salinas: #D4A84A; --salinas-dk: #7A5E1A; --salinas-lt: #E8C476;
        --serif: "Fraunces", Georgia, serif;
        --sans: "Hanken Grotesk", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ber); }
      body { font-family: var(--sans); color: var(--crema); }
      /* Suelo de escenario opaco: guarda contra el flash blanco en los cortes (seam-craft). */
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ber-dk); }
      .clip { position: absolute; inset: 0; }
      .seam { position: absolute; inset: 0; will-change: transform, opacity, filter; }

      /* Capa de fotos: el wrapper .seam lleva el corte; .kb lleva el paneo lento. */
      .photo .kb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; will-change: transform; }
      .photo .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 620px;
        background: radial-gradient(120% 100% at 50% 100%, rgba(26, 8, 32, 0.55), rgba(26, 8, 32, 0) 70%); }

      /* Chip de marca */
      #chip .seam { inset: auto; top: 240px; left: 60px; opacity: 0; }
      .chip-pill { display: inline-flex; align-items: center; gap: 14px; background: var(--ber); color: var(--crema);
        border-radius: 10px 0 10px 0; padding: 16px 24px; font: 700 24px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; }
      .chip-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--salinas); box-shadow: 0 0 0 4px rgba(212, 168, 74, 0.28); }
      .chip-apt { color: var(--salinas); }

      /* La carta */
      #card .seam { inset: auto; top: 800px; left: 60px; width: 960px; opacity: 0; }
      .paper { background: rgba(255, 252, 246, 0.97); color: var(--ink); border-radius: 28px 0 28px 0; padding: 44px 56px 48px; }
      .paper-head { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
      .paper-mark { width: 44px; height: 44px; border-radius: 10px 0 10px 0; background: var(--cobre); color: var(--crema);
        display: flex; align-items: center; justify-content: center; font: 600 26px/1 var(--serif); }
      .paper-from { font: 700 24px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); }
      .paper-from .soft { color: var(--ink-soft); font-weight: 600; }
      .paper-apt { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font: 700 24px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--salinas-dk); }
      .paper-apt .chip-dot { box-shadow: 0 0 0 4px rgba(212, 168, 74, 0.22); }
      .letter { font: 500 42px/1.3 var(--serif); color: var(--ink); white-space: pre-wrap; min-height: 55px; letter-spacing: -0.01em; }
      .letter .txt { display: inline; }
      .caret { display: inline-block; width: 5px; height: 40px; background: var(--salinas-dk); vertical-align: -6px; margin-left: 4px; }
      .sign { margin-top: 22px; text-align: right; font: 600 38px/1 var(--serif); color: var(--cobre-dk); opacity: 0; }

      /* Cierre de marca */
      #cta .seam { inset: auto; top: 620px; left: 70px; width: 940px; opacity: 0; }
      .cta-glow { position: absolute; inset: -220px; border-radius: 50%; opacity: 0;
        background: radial-gradient(closest-side, rgba(212, 168, 74, 0.55), rgba(212, 168, 74, 0) 72%); z-index: 1; }
      .cta-panel { position: relative; z-index: 2; background: var(--ber); border-radius: 28px 0 28px 0; padding: 60px 64px 56px; }
      .cta-kicker { font: 700 24px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--arena); opacity: 0.75; margin-bottom: 22px; }
      .cta-name { font: 600 120px/0.98 var(--serif); letter-spacing: -0.02em; color: var(--crema); }
      .cta-name .apt { color: var(--salinas); display: block; }
      .cta-rule { height: 3px; width: 160px; background: var(--salinas); margin: 34px 0 30px; opacity: 0.9; }
      .cta-line { font: 600 36px/1.35 var(--sans); color: var(--crema); opacity: 0; }
      .cta-url { margin-top: 30px; font: 700 44px/1 var(--sans); color: var(--salinas); letter-spacing: -0.01em; opacity: 0; }
      .cta-en { margin-top: 18px; font: 400 27px/1.4 var(--sans); color: var(--arena); opacity: 0; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-0iqi" id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="24" data-fps="30">

      <!-- Capa de fotos: seis planos, cortes velocity-matched (ledger.json). -->

        <div data-hf-id="hf-btfc" class="seam"><img data-hf-id="hf-fgle" class="kb" id="kb4" src="assets/images/salinas-1.jpg" alt=""><div data-hf-id="hf-ap0w" class="scrim"></div></div>

          <div data-hf-id="hf-dkjq" class="chip-pill"><span data-hf-id="hf-9z0j">Hestía · Vera Playa</span><span data-hf-id="hf-530l" class="chip-dot"></span><span data-hf-id="hf-jhlg" class="chip-apt">Salinas</span></div>

      <!-- La carta -->

            </div>
            <div data-hf-id="hf-z9zs" class="letter"><span data-hf-id="hf-aa8e" class="txt" id="letter-txt"></span><span data-hf-id="hf-cxiq" class="caret" id="letter-caret"></span></div>

      <!-- Cierre de marca -->
      <div data-hf-id="hf-rll5" id="cta" class="clip" data-start="21.51" data-duration="2.49" data-track-index="3">
        <div data-hf-id="hf-dsyh" class="seam">
          <div data-hf-id="hf-f4b2" class="cta-glow" id="cta-glow"></div>
          <div data-hf-id="hf-8svj" class="cta-panel">
            <div data-hf-id="hf-t5b1" class="cta-kicker">Tu casa en Vera Playa</div>
            <div data-hf-id="hf-zw14" class="cta-name">Hestía<span data-hf-id="hf-jznd" class="apt">Salinas</span></div>
            <div data-hf-id="hf-vh9l" class="cta-rule"></div>
            <div data-hf-id="hf-c42p" class="cta-line" id="cta-l1">Reserva directa, 0% comisiones</div>
            <div data-hf-id="hf-wu1c" class="cta-line" id="cta-l2">Respuesta en minutos</div>
            <div data-hf-id="hf-edoq" class="cta-line" id="cta-l3">Mascotas bienvenidas</div>
            <div data-hf-id="hf-s2r3" class="cta-url" id="cta-url">hestiayourhome.com</div>
            <div data-hf-id="hf-amfi" class="cta-en" id="cta-en">September in Vera Playa, direct from your hosts.</div>
          </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;

      // ── Carta: tecleado humano como secuencia discreta de estados (discrete-text-sequence)
      // Cada línea empieza en su t0; los caracteres llegan a ~15 cps con pausas en
      // espacios y signos, y un error corregido en la segunda línea.
      const CPS = 15;
      const LINES = [
        { t0: 0.9,  text: "Hola,\nesto te espera en Salinas en septiembre:" },
        { t0: 5.1,  text: "El mar guarda el calor del verano.", typo: { at: 30, wrong: "0", hold: 0.32 } },
        { t0: 9.2,  text: "Desayuno en la terraza, piscina a media mañana." },
        { t0: 13.0, text: "Es el más luminoso, junto al Parque Natural." },
        { t0: 16.6, text: "Reserva directo: te lo enseñamos en persona." },
      ];
      const STATES = [{ t: 0, text: "", typing: false }];
      (function buildStates() {
        let acc = "";
        for (const line of LINES) {
          let t = line.t0;
          let cur = acc ? acc + "\n" : "";
          STATES.push({ t, text: cur, typing: true });
          const chars = [...line.text];
          for (let i = 0; i < chars.length; i++) {
            const ch = chars[i];
            if (line.typo && i === line.typo.at) {
              cur += line.typo.wrong; t += 1 / CPS; STATES.push({ t, text: cur, typing: true });
              t += line.typo.hold; STATES.push({ t, text: cur, typing: false });
              cur = cur.slice(0, -line.typo.wrong.length); t += 0.09; STATES.push({ t, text: cur, typing: true });
            }
            cur += ch; t += 1 / CPS;
            if (ch === " ") t += 0.04;
            if (ch === ",") t += 0.2;
            if (ch === ":") t += 0.3;
            if (ch === "\n") t += 0.25;
            STATES.push({ t, text: cur, typing: true });
          }
          STATES.push({ t: t + 0.05, text: cur, typing: false });
          acc = cur;
        }
      })();
      const LETTER_DONE = STATES[STATES.length - 1].t;

      const txtEl = document.getElementById("letter-txt");
      const caretEl = document.getElementById("letter-caret");
      function stateAt(time) {
        for (let i = STATES.length - 1; i >= 0; i--) if (time >= STATES[i].t) return STATES[i];
        return STATES[0];
      }
      const driver = { t: 0 };
      tl.to(driver, {
        t: 24, duration: 24, ease: "none",
        onUpdate: () => {
          const s = stateAt(driver.t);
          if (txtEl.textContent !== s.text) txtEl.textContent = s.text;
          // Cursor: fijo mientras teclea, parpadeo cuadrado determinista en las pausas.
          const blinkOn = Math.sin((driver.t / 0.9) * Math.PI * 2) > 0;
          caretEl.style.opacity = s.typing || blinkOn ? "1" : "0";
        },
      }, 0);

      // ── Entradas (waterfall-entry: opacidad binaria + látigo desde abajo)
      tl.set("#chip .seam", { opacity: 1, y: 40 }, 0.2);
      tl.to("#chip .seam", { y: 0, duration: 0.36, ease: "power4.out" }, 0.2);
      tl.set("#card .seam", { opacity: 1, y: 70 }, 0.4);
      tl.to("#card .seam", { y: 0, duration: 0.5, ease: "power4.out" }, 0.4);
      const SIGN_T = Math.max(LETTER_DONE + 0.15, 20.3);
      tl.set("#letter-sign", { opacity: 1, y: 30 }, SIGN_T);
      tl.to("#letter-sign", { y: 0, duration: 0.25, ease: "power4.out" }, SIGN_T);

      // ── Paneo lento de cada foto (cámara con intención; receta Ken Burns sobre .kb)
      const KB = [
        ["#kb1", { scale: 1.12, yPercent: -3 }, { yPercent: 2 }, 0, 4.6],
        ["#kb2", { scale: 1.12, xPercent: 2 }, { xPercent: -2 }, 4.6, 4.2],
        ["#kb3", { scale: 1.12, yPercent: 2 }, { yPercent: -2 }, 8.8, 3.8],
        ["#kb4", { scale: 1.12, xPercent: -2 }, { xPercent: 2 }, 12.6, 3.8],
        ["#kb5", { scale: 1.12, yPercent: -2 }, { yPercent: 2 }, 16.4, 5.11],
        ["#kb6", { scale: 1.12, yPercent: 1 }, { yPercent: -1 }, 21.51, 2.49],
      ];
      for (const [sel, from, to, start, dur] of KB) {
        tl.fromTo(sel, from, { ...to, duration: dur, ease: "none", immediateRender: false }, start);
      }

      // ── Cortes entre fotos: cut-the-curve LEFT (travel ~12% del ancho, eases espejo)
      const TRAVEL = 130;
      function cutTheCurveLeft(outSel, inSel, C) {
        tl.to(outSel, { x: -TRAVEL, scale: 0.96, filter: "blur(8px)", duration: 0.33, ease: "power4.in" }, C - 0.33);
        tl.to(outSel, { opacity: 0, duration: 0.3, ease: "power2.in" }, C - 0.33);
        tl.set(outSel, { opacity: 0 }, C); // hard kill: el seek no lineal nunca ve estado viejo
        tl.fromTo(inSel,
          { x: TRAVEL, scale: 1.04, filter: "blur(8px)", opacity: 0.35 },
          { x: 0, scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.42, ease: "power4.out", immediateRender: false },
          C);
      }
      cutTheCurveLeft("#ph1 .seam", "#ph2 .seam", 4.6);
      cutTheCurveLeft("#ph2 .seam", "#ph3 .seam", 8.8);
      cutTheCurveLeft("#ph3 .seam", "#ph4 .seam", 12.6);
      cutTheCurveLeft("#ph4 .seam", "#ph5 .seam", 16.4);

      // ── Cierre: inverse zoom-through (todo encoge: la carta se retira, la marca llega)
      const T = 21.3, CUT = T + 0.21;
      for (const sel of ["#ph5 .seam", "#card .seam", "#chip .seam"]) {
        const blur = sel.startsWith("#ph") ? "blur(18px)" : "blur(10px)";
        tl.to(sel, { scale: 0.8, filter: blur, duration: 0.21, ease: "power3.in" }, T);
        tl.to(sel, { opacity: 0.15, duration: 0.21, ease: "none" }, T);
        tl.set(sel, { opacity: 0 }, CUT);
      }
      tl.fromTo("#ph6 .seam",
        { scale: 1.25, filter: "blur(18px)", opacity: 0.15 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.49, ease: "expo.out", immediateRender: false }, CUT);
      tl.fromTo("#cta .seam",
        { scale: 1.25, filter: "blur(10px)", opacity: 0.15 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.49, ease: "expo.out", immediateRender: false }, CUT);

      // Halo dorado tras el panel (ambient-glow-bloom, forma bloom-and-hold) y ventajas en cascada.
      tl.fromTo("#cta-glow", { opacity: 0, scale: 0.85 }, { opacity: 0.32, scale: 1, duration: 0.7, ease: "power2.out", immediateRender: false }, CUT + 0.1);
      let w = CUT + 0.55;
      for (const [sel, y, d] of [["#cta-l1", 60, 0.18], ["#cta-l2", 48, 0.15], ["#cta-l3", 44, 0.14], ["#cta-url", 70, 0.18], ["#cta-en", 36, 0.13]]) {
        tl.set(sel, { opacity: 1, y }, w);
        tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, w);
        w += d - F;
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
